          ### Armbian Image Information
          - Default username: `root`
          - Default password: `1234`
          - Install command: `armbian-install`
          - Update command: `armbian-update`
          ### Applicable Platform
          - 🐧 `arm64`
          - 🐋 Docker image: https://hub.docker.com/u/ophub
          EOF
          echo "" >> "$NOTES_FILE"
          echo "Built from commit ${{ github.sha }}" >> "$NOTES_FILE"
          gh release delete "$TAG" --repo "$RELEASE_REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$RELEASE_REPO" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --latest \
            ${{ env.PACKAGED_OUTPUTPATH }}/*
          rm -f "$NOTES_FILE"
