  build-compile-kernel-via-docker:
    if: ${{ github.event.repository.owner.id == github.event.sender.id && inputs.build_type == 'compile-kernel' && inputs.sub_task == 'via-docker' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout private armbian repo
        uses: actions/checkout@v6
        with:
          repository: jfy9606/amlogic-s9xxx-armbian
