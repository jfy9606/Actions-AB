env:
  TZ: Etc/UTC
  ROOTFS_SCRIPT: compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh
  MAKE_DOCKER_SH: compile-kernel/tools/script/docker/build_armbian_docker_image.sh
  TARGET_REPO: ${{ secrets.RELEASE_REPO || vars.RELEASE_REPO || 'jfy9606/amlogic-s9xxx-armbian' }}

jobs:
  setup-from-source:
    if: ${{ github.event.repository.owner.id == github.event.sender.id && inputs.build_type == 'from-source' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix based on set_release input
        id: set-matrix
        run: |
          if [[ "${{ inputs.set_release }}" == "all" ]]; then
            MATRIX='{"include":[{"release":"trixie"},{"release":"bookworm"},{"release":"resolute"},{"release":"noble"}]}'
          else
            MATRIX='{"include":[{"release":"${{ inputs.set_release }}"}]}'
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  setup-from-release:
    if: ${{ github.event.repository.owner.id == github.event.sender.id && inputs.build_type == 'from-release' }}
    runs-on: ubuntu-26.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix based on set_release input
        id: set-matrix
        run: |
          if [[ "${{ inputs.set_release }}" == "all" ]]; then
            MATRIX='{"include":[{"release":"trixie"},{"release":"bookworm"},{"release":"resolute"},{"release":"noble"}]}'
          else
            MATRIX='{"include":[{"release":"${{ inputs.set_release }}"}]}'
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  setup-compile-kernel:
    if: ${{ github.event.repository.owner.id == github.event.sender.id && inputs.build_type == 'compile-kernel' && inputs.sub_task == 'default' }}
    runs-on: ubuntu-26.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix based on kernel_version input
        id: set-matrix
        run: |
          if [[ "${{ inputs.kernel_version }}" == "all" ]]; then
            MATRIX='{"include":[{"kernel_version":"5.10.y"},{"kernel_version":"5.15.y"},{"kernel_version":"6.1.y"},{"kernel_version":"6.6.y"},{"kernel_version":"6.12.y"},{"kernel_version":"6.18.y"}]}'
          else
            MATRIX='{"include":[{"kernel_version":"${{ inputs.kernel_version }}"}]}'
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  setup-docker:
    if: ${{ github.event.repository.owner.id == github.event.sender.id && inputs.build_type == 'docker' }}
    runs-on: ubuntu-26.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix based on source_branch input
        id: set-matrix
        run: |
          if [[ "${{ inputs.source_branch }}" == "all" ]]; then
            MATRIX='{"include":[{"branch":"trixie"},{"branch":"bookworm"},{"branch":"resolute"},{"branch":"noble"}]}'
          else
            MATRIX='{"include":[{"branch":"${{ inputs.source_branch }}"}]}'
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build-from-source:
    needs: [setup-from-source]
    if: ${{ github.event.repository.owner.id == github.event.sender.id && inputs.build_type == 'from-source' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-from-source.outputs.matrix) }}
    name: build-from-source-${{ matrix.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout private armbian repo
        uses: actions/checkout@v6
        with:
          repository: jfy9606/amlogic-s9xxx-armbian
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: ./.github/actions/amlogic-s9xxx-armbian
      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Download Armbian source code
        id: down
        working-directory: /builder
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          df -hT ${PWD}
          git clone -q --single-branch --depth=1 --branch=main https://github.com/armbian/build.git build
          ln -sf /builder/build ${{ github.workspace }}/build
          ln -sf /builder/build /home/runner/work/_actions/jfy9606/amlogic-s9xxx-armbian/main/build
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Compile Armbian arm64 [ ${{ matrix.release }} ]
        id: compile-arm64
        working-directory: /builder
        if: ${{ steps.down.outputs.status == 'success' && inputs.sub_task == 'arm64' && !cancelled() }}
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes 2>/dev/null || true
          config_board="odroidn2"
          cd build/
              ./compile.sh RELEASE=${{ matrix.release }} BOARD=${config_board} BRANCH=current BUILD_MINIMAL=no \
                           BUILD_ONLY=default HOST=armbian BUILD_DESKTOP=no EXPERT=yes KERNEL_CONFIGURE=no \
                           COMPRESS_OUTPUTIMAGE="sha" SHARE_LOG=yes
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Compile Armbian x86 [ ${{ matrix.release }} ]
        id: compile-x86
        working-directory: /builder
        if: ${{ steps.down.outputs.status == 'success' && inputs.sub_task == 'x86' && !cancelled() }}
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes 2>/dev/null || true
          cd build/
              ./compile.sh RELEASE=${{ matrix.release }} BOARD=uefi-x86 BRANCH=current BUILD_MINIMAL=no \
                           BUILD_ONLY=default HOST=armbian BUILD_DESKTOP=no EXPERT=yes KERNEL_CONFIGURE=no \
                           COMPRESS_OUTPUTIMAGE="sha" SHARE_LOG=yes
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Organize output files [arm64]
        id: clean-arm64
        if: ${{ steps.compile-arm64.outputs.status == 'success' && !cancelled() }}
        run: |
          chmod +x ${ROOTFS_SCRIPT}
          ${ROOTFS_SCRIPT} -v ${{ matrix.release }} -s true -c true -k true -p arm64
          cd build/
          rm -rf $(ls . | grep -v "^output$" | xargs) 2>/dev/null
          df -hT ${PWD}
          echo "build_tag=Armbian_${{ matrix.release }}_arm64_${{ inputs.armbian_edition }}_$(date +"%Y.%m")" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Organize output files [x86]
        id: clean-x86
        if: ${{ steps.compile-x86.outputs.status == 'success' && !cancelled() }}
        run: |
          chmod +x ${ROOTFS_SCRIPT}
          ${ROOTFS_SCRIPT} -v ${{ matrix.release }} -s true -c true -k false -p amd64
          [[ -d "armbian" ]] || mkdir armbian
          cp -af build/output/images/* armbian/
          rm -rf build
          df -hT ${PWD}
          echo "build_tag=Armbian_amd64_server_$(date +"%Y.%m")" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Build the Docker image [x86]
        id: makedocker
        if: ${{ steps.clean-x86.outputs.status == 'success' && inputs.publish_docker != 'none' && !cancelled() }}
        run: |
          chmod +x ${MAKE_DOCKER_SH}
          ${MAKE_DOCKER_SH} ${{ matrix.release }} amd64
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Upload Armbian image to Release [arm64]
        if: ${{ steps.clean-arm64.outputs.status == 'success' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ env.build_tag }}"
          RELEASE_REPO="${{ env.TARGET_REPO }}"
          gh release delete "$TAG" --repo "$RELEASE_REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$RELEASE_REPO" \
            --title "$TAG" \
            --notes "Auto-built from commit ${{ github.sha }}" \
            --latest \
            build/output/images/*
      - name: Rebuild Armbian for target boards [arm64]
        uses: ./.github/actions/amlogic-s9xxx-armbian
        if: ${{ steps.clean-arm64.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: ${{ inputs.armbian_board }}
          armbian_kernel: ${{ inputs.armbian_kernel }}
          auto_kernel: true
          kernel_repo: ${{ inputs.kernel_repo }}
          kernel_usage: ${{ inputs.kernel_usage }}
          armbian_fstype: ${{ inputs.armbian_fstype }}
          builder_name: ${{ inputs.builder_name }}
      - name: Upload rebuilt images to Release [arm64]
        if: ${{ env.PACKAGED_STATUS == 'success' && inputs.sub_task == 'arm64' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ env.build_tag }}"
          RELEASE_REPO="${{ env.TARGET_REPO }}"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'EOF'
          ### Armbian Image Information
          - Default username: `root`
          - Default password: `1234`
          - Install command: `armbian-install`
          - Update command: `armbian-update`
          ### Applicable Platform
          - 🐧 `arm64`
          - 🐋 Docker image: https://hub.docker.com/u/ophub
          EOF
          echo "" >> "$NOTES_FILE"
          echo "Built from commit ${{ github.sha }}" >> "$NOTES_FILE"
          gh release delete "$TAG" --repo "$RELEASE_REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$RELEASE_REPO" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --latest \
            ${{ env.PACKAGED_OUTPUTPATH }}/*
          rm -f "$NOTES_FILE"
      - name: Upload Armbian image to Release [x86]
        if: ${{ steps.clean-x86.outputs.status == 'success' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ env.build_tag }}"
          RELEASE_REPO="${{ env.TARGET_REPO }}"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'EOF'
          ### Armbian Image Information
          - Default username: `root`
          - Default password: `1234`
          ### Applicable Platform
          - 💻 `amd64(uefi-x86)`
          - 🐋 Docker image: https://hub.docker.com/u/ophub
          EOF
          echo "" >> "$NOTES_FILE"
          echo "Built from commit ${{ github.sha }}" >> "$NOTES_FILE"
          gh release delete "$TAG" --repo "$RELEASE_REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$RELEASE_REPO" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --latest=false \
            armbian/*,out/*
          rm -f "$NOTES_FILE"
      - name: Login to Docker Hub [x86]
        id: login
        if: ${{ steps.makedocker.outputs.status == 'success' && !cancelled() }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Load and push image to Docker Hub [x86]
        id: push
        if: ${{ steps.makedocker.outputs.status == 'success' && !cancelled() }}
        run: |
          offline_image="$(ls out/*.tar.gz 2>/dev/null | head -n 1)"
          [[ -z "${offline_image}" ]] && echo "Error: No offline image found." && exit 1
          loaded_image="$(docker load -i "${offline_image}" | grep -oP 'Loaded image: \K.*')"
          [[ -z "${loaded_image}" ]] && echo "Error: Failed to load Docker image." && exit 1
          echo "Loaded image: ${loaded_image}"
          docker tag "${loaded_image}" "${{ inputs.publish_docker }}-${{ matrix.release }}:amd64"
          docker push "${{ inputs.publish_docker }}-${{ matrix.release }}:amd64"
          echo "status=success" >> ${GITHUB_OUTPUT}

