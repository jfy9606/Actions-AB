          ln -sf /builder/compile-kernel/output /home/runner/work/_actions/jfy9606/amlogic-s9xxx-armbian/main/compile-kernel/output
          docker run -d --privileged \
              --name armbian-ophub \
              -v /builder/compile-kernel:/opt/kernel/compile-kernel \
              -v /builder/ccache:/root/.ccache \
              -v /etc/localtime:/etc/localtime:ro \
              -v /etc/timezone:/etc/timezone:ro \
              -e CCACHE_DIR=/root/.ccache \
              --restart=always \
              jfy9606/armbian-${{ inputs.docker_image }}:arm64
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Get kernel source hash
        id: kernelhash
        if: ${{ steps.pull.outputs.status }} == 'success' && !cancelled()
        run: |
          api_url="https://api.github.com/repos/${{ inputs.kernel_source }}/linux-${{ inputs.kernel_version }}/git/ref/heads/main"
          source_hash=$(curl -fsSL -m 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${api_url} |
              jq -r '.object.sha'
          )
          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /builder/ccache
          key: kernel-${{ inputs.kernel_toolchain }}-${{ inputs.kernel_version }}-${{ env.source_hash }}
          restore-keys: |
            kernel-${{ inputs.kernel_toolchain }}-${{ inputs.kernel_version }}-
      - name: Compile the kernel [ ${{ inputs.kernel_version }} ]
        uses: ./.github/actions/amlogic-s9xxx-armbian
        if: ${{ steps.pull.outputs.status }} == 'success' && !cancelled()
        with:
          build_target: kernel
          kernel_source: ${{ inputs.kernel_source }}
          kernel_version: ${{ inputs.kernel_version }}
          kernel_auto: ${{ inputs.kernel_auto }}
          delete_source: ${{ inputs.delete_source }}
          kernel_package: ${{ inputs.kernel_package }}
          kernel_sign: ${{ inputs.kernel_sign }}
          kernel_toolchain: ${{ inputs.kernel_toolchain }}
          ccache_clear: ${{ inputs.ccache_clear }}
      - name: Upload Kernel to Release
        if: ${{ env.PACKAGED_STATUS }} == 'success' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="kernel_stable"
          RELEASE_REPO="${{ env.TARGET_REPO }}"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'EOF'
          - These are Mainline LTS(Long Term Support) kernels that provide `stable` support for Armbian.
          - It works with most `Amlogic`, `Rockchip`, and `Allwinner` devices. For specific details, please refer to the instructions on the homepage of repository.
          - Dedicated BSP kernels for other Rockchip and Allwinner devices can be downloaded from the [ophub/kernel](https://github.com/ophub/kernel) repository.
          - 这些是主线 LTS（长期支持）内核，为 Armbian 提供`稳定`的支持。
          - 适用于 `amlogic`，`rockchip`，`allwinner` 的大部分设备，具体可以参考仓库首页的说明。
          - 其他的 Rockchip 和 Allwinner 设备专用 BSP 内核可以在 [ophub/kernel](https://github.com/ophub/kernel) 仓库里下载使用。
          EOF
          echo "" >> "$NOTES_FILE"
          echo "Built from commit ${{ github.sha }}" >> "$NOTES_FILE"
          gh release delete "$TAG" --repo "$RELEASE_REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$RELEASE_REPO" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --latest=false \
            ${{ env.PACKAGED_OUTPUTPATH }}/*
          rm -f "$NOTES_FILE"
  build-compile-kernel-via-host:
    if: ${{ github.event.repository.owner.id == github.event.sender.id && inputs.build_type == 'compile-kernel' && inputs.sub_task == 'via-host' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      CCACHE_DIR: /builder/ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout private armbian repo
        uses: actions/checkout@v6
        with:
          repository: jfy9606/amlogic-s9xxx-armbian
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: ./.github/actions/amlogic-s9xxx-armbian
      - name: Initialization environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo -E apt-get -y update
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)
          sudo -E systemctl daemon-reload
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo -E timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo -E ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo -E timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Create simulated physical disk
        id: disk
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
          sudo truncate -s "${mnt_size}"G /mnt/mnt.img
          sudo truncate -s "${root_size}"G /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6
          sudo pvcreate /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Create a mapped directory
        id: mapped
        working-directory: /builder
        run: |
          df -hT ${PWD}
          mkdir -p /builder/{kernel,output,ccache}
          ln -sf /builder/kernel /home/runner/work/_actions/jfy9606/amlogic-s9xxx-armbian/main/compile-kernel/kernel
          ln -sf /builder/output /home/runner/work/_actions/jfy9606/amlogic-s9xxx-armbian/main/compile-kernel/output
          sudo rm -rf /root/.ccache
          sudo ln -sf /builder/ccache /root/.ccache
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Get kernel source hash
        id: kernelhash
        if: ${{ steps.mapped.outputs.status }} == 'success' && !cancelled()
        run: |
          api_url="https://api.github.com/repos/${{ inputs.kernel_source }}/linux-${{ inputs.kernel_version }}/git/ref/heads/main"
          source_hash=$(curl -fsSL -m 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${api_url} |
              jq -r '.object.sha'
          )
          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /builder/ccache
          key: kernel-${{ inputs.kernel_toolchain }}-${{ inputs.kernel_version }}-${{ env.source_hash }}
          restore-keys: |
            kernel-${{ inputs.kernel_toolchain }}-${{ inputs.kernel_version }}-
      - name: Compile the kernel [ ${{ inputs.kernel_version }} ]
        uses: ./.github/actions/amlogic-s9xxx-armbian
        if: ${{ steps.mapped.outputs.status }} == 'success' && !cancelled()
        with:
          build_target: kernel
          kernel_source: ${{ inputs.kernel_source }}
          kernel_version: ${{ inputs.kernel_version }}
          kernel_auto: ${{ inputs.kernel_auto }}
          delete_source: ${{ inputs.delete_source }}
          kernel_package: ${{ inputs.kernel_package }}
          kernel_sign: ${{ inputs.kernel_sign }}
          kernel_toolchain: ${{ inputs.kernel_toolchain }}
          ccache_clear: ${{ inputs.ccache_clear }}
      - name: Upload Kernel to Release
        if: ${{ env.PACKAGED_STATUS }} == 'success' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="kernel_stable"
          RELEASE_REPO="${{ env.TARGET_REPO }}"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'EOF'
          - These are Mainline LTS(Long Term Support) kernels that provide `stable` support for Armbian.
          - It works with most `Amlogic`, `Rockchip`, and `Allwinner` devices. For specific details, please refer to the instructions on the homepage of repository.
          - Dedicated BSP kernels for other Rockchip and Allwinner devices can be downloaded from the [ophub/kernel](https://github.com/ophub/kernel) repository.
          - 这些是主线 LTS（长期支持）内核，为 Armbian 提供`稳定`的支持。
          - 适用于 `amlogic`，`rockchip`，`allwinner` 的大部分设备，具体可以参考仓库首页的说明。
          - 其他的 Rockchip 和 Allwinner 设备专用 BSP 内核可以在 [ophub/kernel](https://github.com/ophub/kernel) 仓库里下载使用。
          EOF
          echo "" >> "$NOTES_FILE"
          echo "Built from commit ${{ github.sha }}" >> "$NOTES_FILE"
          gh release delete "$TAG" --repo "$RELEASE_REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$RELEASE_REPO" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --latest=false \
            ${{ env.PACKAGED_OUTPUTPATH }}/*
          rm -f "$NOTES_FILE"
  build-docker:
    needs: [setup-docker]
    if: ${{ github.event.repository.owner.id == github.event.sender.id && inputs.build_type == 'docker' }}
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-docker.outputs.matrix) }}
    name: build-docker:${{ matrix.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout private armbian repo
        uses: actions/checkout@v6
        with:
          repository: jfy9606/amlogic-s9xxx-armbian
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: ./.github/actions/amlogic-s9xxx-armbian
      - name: Download Armbian rootfs file [ ${{ matrix.branch }} ]
        id: down
        if: (!cancelled())
        run: |
          latest_version=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.REPO_TOKEN }}" \
              https://api.github.com/repos/jfy9606/amlogic-s9xxx-armbian/releases?per_page=20 | \
              jq -r --arg RTK "Armbian_${{ matrix.branch }}_arm64_" \
              --arg BOARD "rootfs" \
              '[.[] | select(.tag_name | contains($RTK)) |
              {tag: .tag_name} + (.assets[] | select(.name | contains($BOARD) and endswith(".tar.gz")) |
              {data: .updated_at, url: .url, name: .name})] |
              sort_by(.data) |
              reverse |
              .[0]')
          [[ -z "${latest_version}" || "${latest_version}" == "null" ]] && {
              echo "Error: Failed to resolve Armbian rootfs download URL."
              exit 1
          }
          latest_url="$(echo ${latest_version} | jq -r '.url')"
          armbian_filename="$(echo ${latest_version} | jq -r '.name')"
          release_tag="$(echo ${latest_version} | jq -r '.tag')"
          echo "Matched release tag: ${release_tag}"
          echo "build_tag=${release_tag}" >> ${GITHUB_OUTPUT}
          echo "Downloading: ${armbian_filename}"
          [[ -d "armbian" ]] || mkdir -p armbian
          curl -fsSL \
               -H "Authorization: Bearer ${{ secrets.REPO_TOKEN }}" \
               -H "Accept: application/octet-stream" \
               "${latest_url}" \
               -o "armbian/${armbian_filename}"
          [[ "${?}" -ne "0" ]] && echo "Error: Download failed." && exit 1
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Build the Docker image
        id: make
        if: ${{ steps.down.outputs.status == 'success' && !cancelled() }}
        run: |
          chmod +x ${MAKE_DOCKER_SH}
          ${MAKE_DOCKER_SH} ${{ matrix.branch }} arm64
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Upload rebuilt images to Release
        if: ${{ steps.make.outputs.status == 'success' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.down.outputs.build_tag }}"
          RELEASE_REPO="${{ env.TARGET_REPO }}"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'EOF'
          ### Armbian Image Information
          - Default username: `root`
          - Default password: `1234`
          - Install command: `armbian-install`
          - Update command: `armbian-update`
          ### Applicable Platform
          - 🐧 `arm64`
          - 🐋 Docker image: https://hub.docker.com/u/ophub
          EOF
          echo "" >> "$NOTES_FILE"
          echo "Built from commit ${{ github.sha }}" >> "$NOTES_FILE"
          gh release delete "$TAG" --repo "$RELEASE_REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$RELEASE_REPO" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --latest \
            out/*.tar.gz
          rm -f "$NOTES_FILE"
      - name: Login to Docker Hub
        id: login
        if: ${{ steps.make.outputs.status == 'success' && !cancelled() }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Load and push image to Docker Hub
        id: push
        if: ${{ steps.make.outputs.status == 'success' && !cancelled() }}
        run: |
          offline_image="$(ls out/*.tar.gz 2>/dev/null | head -n 1)"
          [[ -z "${offline_image}" ]] && echo "Error: No offline image found." && exit 1
          loaded_image="$(docker load -i "${offline_image}" | grep -oP 'Loaded image: \K.*')"
          [[ -z "${loaded_image}" ]] && echo "Error: Failed to load Docker image." && exit 1
          echo "Loaded image: ${loaded_image}"
          docker tag "${loaded_image}" "${{ inputs.docker_img }}-${{ matrix.branch }}:arm64"
          docker tag "${loaded_image}" "${{ inputs.docker_img }}-${{ matrix.branch }}:latest"
          docker push "${{ inputs.docker_img }}-${{ matrix.branch }}:arm64"
          docker push "${{ inputs.docker_img }}-${{ matrix.branch }}:latest"
          echo "status=success" >> ${GITHUB_OUTPUT}