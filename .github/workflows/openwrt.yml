              jq -r '.object.sha'
          )
          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /builder/ccache
          key: kernel-${{ inputs.kernel_toolchain }}-${{ matrix.kernel_version }}-${{ env.source_hash }}
          restore-keys: |
            kernel-${{ inputs.kernel_toolchain }}-${{ matrix.kernel_version }}-
      - name: Compile the kernel [ ${{ matrix.kernel_version }} ]
        uses: ./.github/actions/amlogic-s9xxx-armbian
        if: ${{ steps.disk.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: kernel
          kernel_source: ${{ inputs.kernel_source }}
          kernel_version: ${{ matrix.kernel_version }}
          kernel_auto: ${{ inputs.kernel_auto }}
          delete_source: ${{ inputs.delete_source }}
          kernel_package: ${{ inputs.kernel_package }}
          kernel_sign: ${{ inputs.kernel_sign }}
          kernel_toolchain: ${{ inputs.kernel_toolchain }}
          ccache_clear: ${{ inputs.ccache_clear }}
          docker_hostpath: /builder
          docker_image: jfy9606/armbian-${{ inputs.docker_image }}:arm64
      - name: Upload Kernel to Release
        uses: jfy9606/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: kernel_stable
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          repo: ${{ env.TARGET_REPO }}
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.RELEASE_TOKEN }}
          body: |
            - These are Mainline LTS(Long Term Support) kernels that provide `stable` support for Armbian and OpenWrt.
            - It works with most `Amlogic`, `Rockchip`, and `Allwinner` devices. For specific details, please refer to the instructions on the homepage of repository.
            - Dedicated BSP kernels for other Rockchip and Allwinner devices can be downloaded from the [ophub/kernel](https://github.com/ophub/kernel) repository.
            - 这些是主线 LTS（长期支持）内核，为 Armbian 和 OpenWrt 提供`稳定`的支持。
            - 适用于 `amlogic`，`rockchip`，`allwinner` 的大部分设备，具体可以参考仓库首页的说明。
            - 其他的 Rockchip 和 Allwinner 设备专用 BSP 内核可以在 [ophub/kernel](https://github.com/ophub/kernel) 仓库里下载使用。

  build-docker:
    needs: [setup-docker]
    if: ${{ github.event.repository.owner.id == github.event.sender.id && inputs.build_type == 'docker' }}
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-docker.outputs.matrix) }}
    name: build-docker:${{ matrix.docker_img }}@${{ matrix.source_branch }}
    env:
      MAKE_DOCKER_SH: ./.github/actions/amlogic-s9xxx-openwrt/config/docker/make_docker_image.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout private openwrt repo
        uses: actions/checkout@v6
        with:
          repository: jfy9606/amlogic-s9xxx-openwrt
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: ./.github/actions/amlogic-s9xxx-openwrt
      - name: Download OpenWrt rootfs file [ ${{ matrix.source_branch }} ]
        id: down
        if: (!cancelled())
        run: |
          if [[ "${{ matrix.source_branch }}" =~ ^openwrt ]]; then
              REPO_URL="https://github.com/openwrt/openwrt"
          elif [[ "${{ matrix.source_branch }}" =~ ^lede ]]; then
              REPO_URL="https://github.com/coolsnowwolf/lede"
          elif [[ "${{ matrix.source_branch }}" =~ ^immortalwrt ]]; then
              REPO_URL="https://github.com/immortalwrt/immortalwrt"
          else
              echo "Error: Unknown source code repository."
              exit 1
          fi
          source_branch_input="${{ matrix.source_branch }}"
          REPO_NAME="${source_branch_input%_*}"
          REPO_BRANCH="${source_branch_input##*_}"
          latest_version=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.REPO_TOKEN }}" \
              https://api.github.com/repos/jfy9606/amlogic-s9xxx-openwrt/releases?per_page=20 | \
              jq -r --arg RTK "OpenWrt_${{ matrix.source_branch }}_" \
              --arg BOARD "-rootfs.tar.gz" \
              '[.[] | select(.tag_name | contains($RTK)) |
              {tag: .tag_name} + (.assets[] | select(.name | endswith($BOARD)) |
              {data: .updated_at, url: .url, name: .name})] |
              sort_by(.data) |
              reverse |
              .[0]')
          [[ -z "${latest_version}" || "${latest_version}" == "null" ]] && {
              echo "Error: Failed to resolve OpenWrt rootfs download URL."
              exit 1
          }
          latest_url="$(echo ${latest_version} | jq -r '.url')"
          openwrt_filename="$(echo ${latest_version} | jq -r '.name')"
          release_tag="$(echo ${latest_version} | jq -r '.tag')"
          echo "Matched release tag: ${release_tag}"
          echo "build_tag=${release_tag}" >> ${GITHUB_OUTPUT}
          [[ -d "openwrt" ]] || mkdir -p openwrt
          echo "Downloading: ${openwrt_filename}"
          curl -fsSL \
               -H "Authorization: Bearer ${{ secrets.REPO_TOKEN }}" \
               -H "Accept: application/octet-stream" \
               "${latest_url}" \
               -o "openwrt/${openwrt_filename}"
          [[ "${?}" -ne "0" ]] && echo "Error: Download failed." && exit 1
          df -hT ${PWD}
          echo "REPO_URL=${REPO_URL}" >> ${GITHUB_ENV}
          echo "REPO_NAME=${REPO_NAME}" >> ${GITHUB_ENV}
          echo "REPO_BRANCH=${REPO_BRANCH}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Build the Docker image
        id: make
        if: ${{ steps.down.outputs.status == 'success' && !cancelled() }}
        run: |
          chmod +x ${MAKE_DOCKER_SH}
          ${MAKE_DOCKER_SH} ${{ matrix.source_branch }} arm64
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Upload packaged OpenWrt to Release
        uses: jfy9606/upload-to-releases@main
        if: ${{ steps.make.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ steps.down.outputs.build_tag }}
          artifacts: out/*.tar.gz
          repo: ${{ env.TARGET_REPO }}
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.RELEASE_TOKEN }}
          body: |
            ### OpenWrt Image Information
            - Default IP: `192.168.1.1`
            - Default username: `root`
            - Default password: `password`
            - Default WIFI name: `OpenWrt`
            - Default WIFI password: `none`
            ### Install to EMMC
            - Login to OpenWrt → `System` → `Amlogic Service` → `Install OpenWrt`
            ### OpenWrt source code
            - [${{ env.REPO_NAME }}](${{ env.REPO_URL }}/tree/${{ env.REPO_BRANCH }})
            ### Applicable Platform
            - 🐧 `arm64`
            - 🐋 Docker image: https://hub.docker.com/u/ophub
      - name: Login to Docker Hub
        id: login
        if: ${{ steps.make.outputs.status == 'success' && !cancelled() }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Load and push image to Docker Hub
        id: push
        if: ${{ steps.make.outputs.status == 'success' && !cancelled() }}
        run: |
          offline_image="$(ls out/*.tar.gz 2>/dev/null | head -n 1)"
          [[ -z "${offline_image}" ]] && echo "Error: No offline image found." && exit 1
          loaded_image="$(docker load -i "${offline_image}" | grep -oP 'Loaded image: \K.*')"
          [[ -z "${loaded_image}" ]] && echo "Error: Failed to load Docker image." && exit 1
          echo "Loaded image: ${loaded_image}"
          docker tag "${loaded_image}" "${{ matrix.docker_img }}:arm64"
          docker tag "${loaded_image}" "${{ matrix.docker_img }}:latest"
          docker push "${{ matrix.docker_img }}:arm64"
          docker push "${{ matrix.docker_img }}:latest"
          echo "status=success" >> ${GITHUB_OUTPUT}